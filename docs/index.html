<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConvertirFacile</title>
<meta name="description" content="Convertisseur d'unités / Unit converter">
<link rel="canonical" href="https://tonsite.fr/fr/">
<link rel="alternate" hreflang="fr" href="https://tonsite.fr/fr/">
<link rel="alternate" hreflang="en" href="https://tonsite.fr/en/">
<link rel="alternate" hreflang="x-default" href="https://tonsite.fr/fr/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script>
(function(){
  try {
    var stored = localStorage.getItem('lang');
    if (stored === 'fr' || stored === 'en') {
      location.replace('/' + stored + '/');
      return;
    }
  } catch(e){}
  var nav = (navigator.language || 'en').toLowerCase();
  var lang = nav.indexOf('fr') === 0 ? 'fr' : 'en';
  location.replace('/' + lang + '/');
})();
</script>
</head>
<body>
<noscript>
  <p style="padding:2rem;text-align:center;font-family:system-ui">
    <a href="/fr/">Français</a> · <a href="/en/">English</a>
  </p>
</noscript>
</body>
</html>
